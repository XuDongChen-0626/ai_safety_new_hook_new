# Hook product sysbuild (MCUboot) configuration.
# Keep this file ASCII only: the PowerShell dev workflow reads and rewrites
# it with the system ANSI codepage.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# Development signing key (keys/ is gitignored). The dev workflow rewrites
# this line to an absolute path before invoking west.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="keys/craner_hook_root-rsa-2048.pem"
