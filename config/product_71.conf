# Hook AI safety controller (ProductId=71) product configuration.
# Keep this file ASCII only: the PowerShell dev workflow reads and rewrites
# it with the system ANSI codepage.

# Modbus RTU slave address of this controller on the host RS485 bus.
CONFIG_HOOK_MODBUS_SLAVE_ID=1

# 4G / cloud channel (usr.cn transparent module + binary 0xA5 protocol).
CONFIG_HOOK_4G_ENABLE=y

# GPS time source and the RTC based power schedule (hard standby).
CONFIG_HOOK_GPS_ENABLE=y
CONFIG_HOOK_HARD_STANDBY_ENABLE=y

# Heartbeat supervision relay and external sound & light module.
CONFIG_HOOK_HEARTBEAT_RELAY_ENABLE=y
CONFIG_HOOK_ALARM_MODULE_ENABLE=y

# BMS battery / charge-discharge time polling.
CONFIG_HOOK_BMS_ENABLE=y

# Field timeouts in milliseconds (same values as the old system_def.h).
CONFIG_HOOK_HEARTBEAT_SILENCE_MS=10000
CONFIG_HOOK_HEARTBEAT_TIMEOUT_MS=60000
CONFIG_HOOK_LOW_BATTERY_THRESHOLD=2000

# Default sound & light module volume (0x001E = 30).
CONFIG_HOOK_DEFAULT_ALARM_VOLUME=30

# Default daily schedule, packed as (Beijing hour << 8) | minute:
#   0x0600 = 1536 -> power on  06:00
#   0x1500 = 5376 -> power off 21:00
CONFIG_HOOK_POWER_ON_TIME_HHMM=1536
CONFIG_HOOK_POWER_OFF_TIME_HHMM=5376
