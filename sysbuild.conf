# Build MCUboot together with the application.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Standard MCUboot OTA layout: boot from slot0, download to slot1, then swap
# slot0 and slot1 using MCUboot move mode on reboot.
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y

# Local development signing key (regenerate with imgtool; keys/ is ignored by
# git). Replace with a hardware-specific production key before release.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="keys/craner_hook_root-rsa-2048.pem"
