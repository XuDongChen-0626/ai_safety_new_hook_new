# ============================================================
# craner_ai_safety_hook - Zephyr project configuration
# Refactored from the STM32CubeIDE + FreeRTOS firmware
# (crane_ai_satefy_hook.ioc / hook.zip).
#
# Framework: same structure as craner_ai_safety_car
#   boards/ + src/ + component/ + module/ + app/ + config/
# OTA is MCUboot (sysbuild) + MCUmgr over the debug console (SMP over shell).
# ============================================================

# --- Platform basics ---
CONFIG_BOOT_BANNER=y
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=n
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_PICOLIBC=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Link the application image into the MCUboot slot0 partition.
CONFIG_USE_DT_CODE_PARTITION=y

# --- Kernel / threads ---
CONFIG_NUM_PREEMPT_PRIORITIES=15
CONFIG_NUM_COOP_PRIORITIES=0
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# --- Watchdog (IWDG). The system health service owns the feed loop. ---
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_IWDG_STM32=y
# The effective IWDG timeout is installed by the health feed backend through
# wdt_install_timeout(): CONFIG_SYS_HEALTH_WDT_TIMEOUT_MS = 30000 ms (module
# default). It is not set here because that symbol depends on
# CONFIG_SYS_HEALTH_WATCHDOG_FEED_BACKEND, which is off in this product.
# Note: IWDG_STM32_INITIAL_TIMEOUT cannot be used for 30 s - its Kconfig range
# stops at 26214 ms (worst-case LSI); the runtime limit with the H7 LSI at
# 32 kHz is 32768 ms, so 30000 ms is accepted by the driver.

# --- RTC (LSE) / backup registers / alarm B (standby wakeup) ---
CONFIG_RTC=y
CONFIG_RTC_STM32=y
CONFIG_RTC_ALARM=y
CONFIG_BBRAM=y
CONFIG_BBRAM_STM32=y

# --- Flash and MCUboot image manager ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
# Erase slot1 sector by sector as the OTA image is streamed in: the tool
# waits for a Ymodem ACK per packet, so a full 768 KiB erase up front would
# stall the first packets for many seconds.
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# --- Shell on uart5 (115200), logs routed through the shell ---
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="hook> "
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_VT100_COLORS=y
CONFIG_SHELL_STACK_SIZE=4096

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=3
CONFIG_LOG_CMDS=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_INF=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_LOG_RATELIMIT=y
CONFIG_LOG_RATELIMIT_INTERVAL_MS=3000

# --- MCUmgr over the shell (SMP over console, base64 framed) ---
# Upload with:
#   mcumgr --conntype serial --connstring dev=COM7,baud=115200 image upload \
#          build/craner_hook_stm32h743vit6/craner_ai_safety_hook/zephyr/zephyr.signed.bin
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_VERBOSE_ERR=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_TRANSPORT_SHELL_INPUT_TIMEOUT=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=5120

# --- OTA manager service (image test / confirm / rollback protection) ---
CONFIG_OTA_MANAGER_SERVICE=y
CONFIG_OTA_MANAGER_SERVICE_TEST_TIMEOUT_S=3600

# --- System health service: field events + watchdog owner ---
CONFIG_SYS_HEALTH_SERVICE=y
CONFIG_SYS_HEALTH_SERVICE_SHELL=y
CONFIG_SYS_HEALTH_MAX_EVENTS=16
CONFIG_SYS_HEALTH_CHECK_INTERVAL_MS=100
# Watchdog feed backend. The IWDG is only started from wdt_setup(), i.e. by
# this backend, so with it disabled there is no watchdog at all (same as the
# old CubeMX firmware). Enable it to have a task that stops checking in
# reset the controller; OTA suspends the check-in window through
# hook_health_ota_gate(). The feed interval stays at the module default (1 s).
CONFIG_SYS_HEALTH_WATCHDOG_FEED_BACKEND=n
CONFIG_SYS_HEALTH_REBOOT_ACTION_BACKEND=y
# No Ethernet on this product: the ICMP probe and network watchdog stay off.
CONFIG_SYS_HEALTH_ICMP_PROBE=n
CONFIG_SYS_HEALTH_STACK_USAGE_CHECK=y
CONFIG_SYS_HEALTH_STACK_USAGE_CHECK_INTERVAL_MS=30000
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# --- Time manager (trusted time for the RTC power schedule) ---
CONFIG_TIME_MANAGER_SERVICE=y
CONFIG_TIME_SYNC_ZEPHYR_REALTIME=y
CONFIG_TIME_SOURCE_NTP=n
CONFIG_SNTP=n
CONFIG_TIME_SOURCE_RTC=y
CONFIG_TIME_RTC_BACKEND_INSIDE_RTC=y
CONFIG_TIME_RTC_TRUST_STORE=y
CONFIG_TIME_RTC_MIN_VALID_UNIX_TIME=1704067200
CONFIG_TIME_LOCAL_FORMAT=y
CONFIG_TIME_LOCAL_TIMEZONE_OFFSET_MINUTES=480

# --- Fault dump service: reset reason + retained fatal record ---
CONFIG_FAULT_DUMP_SERVICE=y
CONFIG_FAULT_DUMP_SERVICE_FATAL_RECORD=y
CONFIG_FAULT_DUMP_SERVICE_FATAL_HANDLER=y
CONFIG_FAULT_DUMP_SERVICE_RESET_REASON=y
CONFIG_FAULT_DUMP_SERVICE_RESET_REASON_STM32H7XX=y
CONFIG_FAULT_DUMP_SERVICE_SHELL=y
CONFIG_FAULT_DUMP_SERVICE_REMINDER=n
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH_PARTITION=y

# --- Hook product application defaults (product_71.conf overrides) ---
CONFIG_HOOK_MODBUS_SLAVE_ID=1

# --- Modbus register table (module/modbus_data_model) ---
# The hook register map is a named table with access flags and defaults; the
# RTU slave serves it through component/am_modbus callbacks. The persistent
# store keeps the power on/off schedule in the modbus-store partition.
CONFIG_MODBUS_DATA_MODEL=y
CONFIG_MODBUS_DATA_MODEL_STORE=y
CONFIG_MODBUS_DATA_MODEL_STORE_FLASH=y
CONFIG_MODBUS_DATA_MODEL_SHELL=y
# The store lives on the on-board W25Q64 QSPI NOR flash (two 4 KiB banks,
# one NOR sector each), so the internal flash keeps its OTA layout.
CONFIG_MODBUS_DATA_MODEL_STORE_MIN_BYTES=8192
CONFIG_MODBUS_DATA_MODEL_STORE_PAYLOAD_BYTES=256

# --- Device identity + parameter server (persisted in the QSPI param-store) ---
# Hardware UID derived identity (short id, hostname, MQTT client id) plus a
# small persistent parameter set (factory device number, labels). Zephyr
# Settings/ZMS stores it in the param-store partition on the QSPI flash.
CONFIG_DEVICE_PARAM_SERVER=y
CONFIG_DEVICE_PARAM_SERVER_MAX_PARAMS=32
CONFIG_DEVICE_PARAM_SERVER_MAX_VALUE_LEN=64
CONFIG_DEVICE_IDENTITY_SERVICE=y
CONFIG_DEVICE_IDENTITY_USE_PARAM_SERVER=y
CONFIG_DEVICE_IDENTITY_SHELL=y
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_FORCE_MOUNT=y

# --- SD card + FATFS + curated offline event log (component/offline_log_service) --
# The SD seat is wired to SDMMC1 (see the board dts); logs are written under
# /SD:/olog/ and can be pulled off the card or over the MCUmgr file group.
CONFIG_FILE_SYSTEM=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MAX_LFN=64
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_HAS_RTC=y
CONFIG_FS_FATFS_NUM_FILES=8
CONFIG_FS_FATFS_NUM_DIRS=8
CONFIG_OFFLINE_LOG_SERVICE=y
CONFIG_OFFLINE_LOG_SHELL=y
CONFIG_OFFLINE_LOG_MCUMGR=y
CONFIG_OFFLINE_LOG_WRITER_STACK_SIZE=4096
CONFIG_OFFLINE_LOG_FREE_SPACE_MIN_KB=8192
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_FILE_STATUS=y
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_IEEE_CRC32=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
# Download chunk size stays at the automatic value: the SMP-over-shell
# transport netbuf caps it at 384 bytes (the car could use 1024 because it
# runs the file group over Ethernet).
CONFIG_MCUMGR_GRP_FS_FILE_AUTOMATIC_IDLE_CLOSE_TIME=10000

# Modbus RTU timing is handled by component/am_modbus (T3.5 derived from the
# port baudrate); the Zephyr Modbus subsystem itself is not used here because
# this product speaks Modbus RTU on RS485 only (no Modbus TCP).
